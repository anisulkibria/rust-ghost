[package]
name = "ghost-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Upload-time image optimisation (Settings → Images). The same version and a
# subset of the features ghost-front already builds, so cargo unifies them and
# nothing is compiled twice.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ghost-core = { workspace = true }
ghost-db = { workspace = true }
ghost-nql = { workspace = true }
ghost-render = { workspace = true }
ghost-routing = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
ghost-mail = { workspace = true }
ghost-stripe = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
bcrypt = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand_08 = { package = "rand", version = "0.8" }
httpdate = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mpp = { version = "0.17.1", default-features = false, features = ["server", "stripe", "tempo", "reqwest-rustls-tls-no-provider"] }
percent-encoding = { workspace = true }
form_urlencoded = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
base64 = "0.22"
tower-http = { workspace = true }

csv = { workspace = true }

hmac = { workspace = true }
# HMAC-SHA1 for X's OAuth 1.0a signatures — the only scheme X accepts for
# posting on a user's behalf with keys that do not expire.
sha1 = "0.10"
